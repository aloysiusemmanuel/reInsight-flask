<div class="container-fluid d-flex align-items-center justify-content-between">

    <!-- Left -->
    <div class="d-flex align-items-center gap-3 flex-grow-1">

        <button class="btn btn-light border d-lg-none me-2"
                id="teacherSidebarToggle">

            <i class="bi bi-list"></i>

        </button>

        <div class="flex-grow-1">

            <h5 class="mb-0 fw-semibold">Teacher Dashboard</h5>

            <small class="text-muted">
                Welcome to your teaching workspace.
            </small>

        </div>

    </div>

    <!-- Center -->
    <div class="d-none d-md-block mx-4"
         style="width: 100%;">

        <div class="input-group">

            <span class="input-group-text bg-white border-end-0">

                <i class="bi bi-search text-muted"></i>

            </span>

            <input type="text"
                   class="form-control border-start-0"
                   placeholder="Search students, classes...">

        </div>

    </div>

    <!-- Right -->
    <div class="d-flex align-items-center gap-3 flex-grow-1">

        <button class="btn btn-light border position-relative">

            <i class="bi bi-calendar3"></i>

        </button>

        <button class="btn btn-light border position-relative">

            <i class="bi bi-bell"></i>

            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                3
            </span>

        </button>

        <div class="dropdown">

            <button class="btn btn-light border d-flex align-items-center gap-2"
                    data-bs-toggle="dropdown">

                <img src="https://ui-avatars.com/api/?name=Teacher&background=2563EB&color=fff"
                     width="34"
                     height="34"
                     class="rounded-circle">

                <div class="text-start d-none d-lg-block">

                    <div class="fw-semibold small">Teacher</div>

                    <div class="text-muted small">Staff ID</div>

                </div>

                <i class="bi bi-chevron-down small"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                    <a class="dropdown-item"
                       href="{{ url_for('teacher_dashboard.teacher_profile') }}">

                        <i class="bi bi-person me-2"></i>My Profile
                    </a>
                </li>

                <li>
                    <a class="dropdown-item"
                       href="{{ url_for('teacher_dashboard.teacher-settings') }}">

                        <i class="bi bi-gear me-2"></i>Settings
                    </a>
                </li>

                <li><hr class="dropdown-divider"></li>

                <li>
                    <a class="dropdown-item text-danger"
                       href="#">

                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</div>
