<!-- ==================================================
GENERIC CONFIRMATION MODAL
=================================================== -->

<div class="modal fade"
     id="confirmModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow-lg rounded-4">

            <div class="modal-header border-0">

                <h5 class="modal-title fw-semibold">

                    Confirm Action

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body text-center py-4">

                <div class="mb-3">

                    <i class="bi bi-exclamation-circle-fill text-warning"
                       style="font-size: 3rem;"></i>

                </div>

                <p class="mb-0 text-muted">

                    Are you sure you want to continue with this action?

                </p>

            </div>

            <div class="modal-footer border-0 justify-content-center">

                <button type="button"
                        class="btn btn-light px-4"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-primary px-4">

                    Continue

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ==================================================
DOWNLOAD REPORT MODAL
=================================================== -->

<div class="modal fade"
     id="downloadReportModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content border-0 shadow-lg rounded-4">

            <div class="modal-header border-0">

                <h5 class="modal-title fw-semibold">

                    Download Report Card

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body text-center py-4">

                <div class="mb-3">

                    <i class="bi bi-file-earmark-pdf-fill text-danger"
                       style="font-size: 3rem;"></i>

                </div>

                <h6 class="fw-semibold">

                    Child One - Third Term

                </h6>

                <p class="text-muted mb-4">

                    Choose a format to download the report card.

                </p>

                <div class="d-grid gap-3">

                    <a href="#"
                       class="btn btn-danger">

                        <i class="bi bi-download me-2"></i>

                        Download PDF

                    </a>

                    <a href="#"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-printer me-2"></i>

                        Print Report

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- ==================================================
CONTACT TEACHER MODAL
=================================================== -->

<div class="modal fade"
     id="contactTeacherModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered modal-lg">

        <div class="modal-content border-0 shadow-lg rounded-4">

            <div class="modal-header border-0">

                <h5 class="modal-title fw-semibold">

                    Contact Teacher

                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <form>

                    <div class="mb-3">

                        <label class="form-label fw-medium">

                            Child

                        </label>

                        <select class="form-select">

                            <option>Child One - JSS 2A</option>

                            <option>Child Two - Primary 5</option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-medium">

                            Subject

                        </label>

                        <input type="text"
                               class="form-control"
                               placeholder="Enter message subject">

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-medium">

                            Message

                        </label>

                        <textarea class="form-control"
                                  rows="5"
                                  placeholder="Write your message to the teacher..."></textarea>

                    </div>

                </form>

            </div>

            <div class="modal-footer border-0">

                <button type="button"
                        class="btn btn-light"
                        data-bs-dismiss="modal">

                    Cancel

                </button>

                <button type="button"
                        class="btn btn-primary">

                    <i class="bi bi-send me-2"></i>

                    Send Message

                </button>

            </div>

        </div>

    </div>

</div>
