<!-- ==========================================================
     SUPER ADMIN CHART CARD
=========================================================== -->

<div class="card shadow-sm border-0 h-100">

    <!-- ==========================================
         CARD HEADER
    =========================================== -->

    <div class="card-header bg-white border-bottom">

        <div class="d-flex justify-content-between align-items-center">

            <div>

                <h5 class="fw-bold mb-1">

                    {{ chart_title|default("Chart") }}

                </h5>

                {% if chart_subtitle %}

                <small class="text-muted">

                    {{ chart_subtitle }}

                </small>

                {% endif %}

            </div>

            {% if chart_action %}

            <a
                href="{{ chart_url|default('#') }}"
                class="btn btn-sm btn-outline-primary">

                {{ chart_action }}

            </a>

            {% endif %}

        </div>

    </div>

    <!-- ==========================================
         CARD BODY
    =========================================== -->

    <div class="card-body">

        <div
            style="
                position: relative;
                height: {{ chart_height|default('350px') }};
            ">

            <canvas
                id="{{ chart_id|default('chart') }}">
            </canvas>

        </div>

    </div>

    <!-- ==========================================
         CARD FOOTER
    =========================================== -->

    {% if chart_footer %}

    <div class="card-footer bg-white">

        <small class="text-muted">

            {{ chart_footer }}

        </small>

    </div>

    {% endif %}

</div>
