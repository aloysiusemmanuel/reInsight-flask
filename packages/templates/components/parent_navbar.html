<div class="container-fluid d-flex align-items-center justify-content-between flex-wrap gap-3">

    <!-- Left Section -->
    <div class="d-flex align-items-center gap-3 flex-grow-1">

        <!-- Sidebar Toggle -->
        <button class="btn btn-light border d-lg-none"
                id="parentSidebarToggle">

            <i class="bi bi-list"></i>

        </button>

        <!-- Page Title -->
        <div>

            <h5 class="mb-0 fw-semibold text-dark">

                Parent Dashboard

            </h5>

            <small class="text-muted">

                Stay connected with your child’s progress

            </small>

        </div>

    </div>

    <!-- Center Section (Search) -->
    <div class="d-none d-md-block"
         style="width: 360px;">

        <div class="input-group">

            <span class="input-group-text bg-white border-end-0">

                <i class="bi bi-search text-muted"></i>

            </span>

            <input type="text"
                   class="form-control border-start-0"
                   placeholder="Search child, report, attendance...">

        </div>

    </div>

    <!-- Right Section -->
    <div class="d-flex align-items-center gap-3">

        <!-- Notifications -->
        <button class="btn btn-light border position-relative">

            <i class="bi bi-bell"></i>

            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                2

            </span>

        </button>

        <!-- Messages -->
        <button class="btn btn-light border position-relative">

            <i class="bi bi-chat-dots"></i>

            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary">

                1

            </span>

        </button>

        <!-- Profile Dropdown -->
        <div class="dropdown">

            <button class="btn btn-light border d-flex align-items-center gap-2"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                <img src="https://ui-avatars.com/api/?name=Parent&background=2563EB&color=fff"
                     alt="Parent"
                     width="34"
                     height="34"
                     class="rounded-circle">

                <div class="text-start d-none d-lg-block">

                    <div class="fw-semibold small">

                        Parent

                    </div>

                    <div class="text-muted small">

                        Account

                    </div>

                </div>

                <i class="bi bi-chevron-down small"></i>

            </button>

            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">

                <li>

                    <a class="dropdown-item"
                       href="{{ url_for('parent.profile') }}">

                        <i class="bi bi-person me-2"></i>

                        My Profile

                    </a>

                </li>

                <li>

                    <a class="dropdown-item"
                       href="{{ url_for('parent.settings') }}">

                        <i class="bi bi-gear me-2"></i>

                        Settings

                    </a>

                </li>

                <li><hr class="dropdown-divider"></li>

                <li>

                    <a class="dropdown-item text-danger"
                       href="#">

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Logout

                    </a>

                </li>

            </ul>

        </div>

    </div>

</div>
